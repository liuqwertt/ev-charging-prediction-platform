[project]
name = "enger"
version = "0.1.0"
description = "A Flask-based web platform for EV charging pile data visualization and machine learning prediction (SOC, charging time, charging fee, and charging platform)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.3",
    "hdfs>=2.7.3",
    "matplotlib>=3.11.0",
    "pandas>=3.0.3",
    "seaborn>=0.13.0",
    "scikit-learn>=1.5.0",
    "lightgbm>=4.0.0",
    "joblib>=1.3.0",
    "flask-caching>=2.3.0",
]
