<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>充电时间与次数频率分析</title>
    <link href="{{ url_for('static', filename='css/custom.css') }}" rel="stylesheet">
</head>
<body>
    <div class="app-shell">
        {% set active = 'bda1' %}
        {% include '_sidebar.html' %}

        <div class="main-panel">
            {% include '_topbar.html' %}

            <div class="content">
                {% if error %}
                <div class="alert alert-warning" role="alert">{{ error }}</div>
                {% endif %}

                <div class="card">
                    <div class="card-body">
                        <h4 class="card-title">设备的每日、每月充电频数</h4>
                        <div class="chart-grid">
                            <div class="chart-item">
                                <h6 class="chart-subtitle">设备的每日充电频数</h6>
                                <div class="chart-frame">
                                    {% if plot_url %}
                                    <img src="data:image/png;base64, {{ plot_url }}" alt="每日充电频数" class="chart-img">
                                    {% else %}
                                    <p class="text-muted text-center">暂无数据</p>
                                    {% endif %}
                                </div>
                            </div>
                            <div class="chart-item">
                                <h6 class="chart-subtitle">设备每月充电频数</h6>
                                <div class="chart-frame">
                                    {% if plot_url2 %}
                                    <img src="data:image/png;base64, {{ plot_url2 }}" alt="每月充电频数" class="chart-img">
                                    {% else %}
                                    <p class="text-muted text-center">暂无数据</p>
                                    {% endif %}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
