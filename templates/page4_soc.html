<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>预测剩余电量 - SOC</title>
    <link href="{{ url_for('static', filename='css/custom.css') }}" rel="stylesheet">
</head>
<body>
    <div class="app-shell">
        {% set active = 'predict_soc' %}
        {% include '_sidebar.html' %}

        <div class="main-panel">
            {% include '_topbar.html' %}

            <div class="content">
                <div class="card">
                    <div class="card-body">
                        <h4 class="card-title">预测剩余电量（SOC）</h4>
                        <p class="card-subtitle text-muted">输入电池实时检测数据，预测当前电池剩余电量百分比</p>

                        <form id="socForm" class="predict-form">
                            <div class="form-section">
                                <div class="form-section-title">基本信息</div>
                                <div class="form-grid">
                                    <div class="form-item">
                                        <label for="record_time">记录时间</label>
                                        <input type="datetime-local" class="form-input" id="record_time" name="record_time" required>
                                    </div>
                                    <div class="form-item">
                                        <label for="pack_voltage">组电压 <span class="unit">(V)</span></label>
                                        <input type="number" step="0.001" class="form-input" id="pack_voltage" name="pack_voltage" value="380" required>
                                    </div>
                                </div>
                            </div>

                            <div class="form-section">
                                <div class="form-section-title">电流与电压</div>
                                <div class="form-grid">
                                    <div class="form-item">
                                        <label for="charge_current">充电电流 <span class="unit">(A)</span></label>
                                        <input type="number" step="0.01" class="form-input" id="charge_current" name="charge_current" value="75" required>
                                    </div>
                                    <div class="form-item">
                                        <label for="max_cell_voltage">最高单体电压 <span class="unit">(V)</span></label>
                                        <input type="number" step="0.001" class="form-input" id="max_cell_voltage" name="max_cell_voltage" value="4.005" required>
                                    </div>
                                    <div class="form-item">
                                        <label for="min_cell_voltage">最低单体电压 <span class="unit">(V)</span></label>
                                        <input type="number" step="0.001" class="form-input" id="min_cell_voltage" name="min_cell_voltage" value="3.982" required>
                                    </div>
                                </div>
                            </div>

                            <div class="form-section">
                                <div class="form-section-title">温度与能量</div>
                                <div class="form-grid">
                                    <div class="form-item">
                                        <label for="max_temperature">最高温度 <span class="unit">(℃)</span></label>
                                        <input type="number" step="0.1" class="form-input" id="max_temperature" name="max_temperature" value="35" required>
                                    </div>
                                    <div class="form-item">
                                        <label for="min_temperature">最低温度 <span class="unit">(℃)</span></label>
                                        <input type="number" step="0.1" class="form-input" id="min_temperature" name="min_temperature" value="30" required>
                                    </div>
                                    <div class="form-item">
                                        <label for="available_energy">可用能量 <span class="unit">(kw)</span></label>
                                        <input type="number" step="0.01" class="form-input" id="available_energy" name="available_energy" value="8.06" required>
                                    </div>
                                    <div class="form-item">
                                        <label for="available_capacity">可用容量 <span class="unit">(Ah)</span></label>
                                        <input type="number" step="0.01" class="form-input" id="available_capacity" name="available_capacity" value="27.50" required>
                                    </div>
                                </div>
                            </div>

                            <div class="form-actions">
                                <button type="submit" class="btn-predict">预测 SOC</button>
                            </div>
                        </form>

                        <div id="resultContainer" style="display: none;">
                            <div class="result-box" id="resultBox">
                                <div class="result-title" id="resultTitle">预测结果</div>
                                <div class="result-value" id="socResult">--<span class="result-unit">%</span></div>
                            </div>
                        </div>

                        <div id="errorContainer" style="display: none;">
                            <div class="result-box error" id="errorBox">
                                <div class="result-title">出错了</div>
                                <div class="result-value" id="errorMessage">--</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('socForm').addEventListener('submit', function(e) {
            e.preventDefault();

            var formData = {
                'record_time': document.getElementById('record_time').value,
                'pack_voltage (V)': parseFloat(document.getElementById('pack_voltage').value),
                'charge_current (A)': parseFloat(document.getElementById('charge_current').value),
                'max_cell_voltage (V)': parseFloat(document.getElementById('max_cell_voltage').value),
                'min_cell_voltage (V)': parseFloat(document.getElementById('min_cell_voltage').value),
                'max_temperature (℃)': parseFloat(document.getElementById('max_temperature').value),
                'min_temperature (℃)': parseFloat(document.getElementById('min_temperature').value),
                'available_energy (kw)': parseFloat(document.getElementById('available_energy').value),
                'available_capacity (Ah)': parseFloat(document.getElementById('available_capacity').value)
            };

            fetch('/predict_soc_api', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(formData)
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById('errorContainer').style.display = 'none';
                document.getElementById('socResult').innerHTML = data.soc + '<span class="result-unit">%</span>';
                document.getElementById('resultContainer').style.display = 'block';
            })
            .catch(error => {
                document.getElementById('resultContainer').style.display = 'none';
                document.getElementById('errorMessage').textContent = error.message;
                document.getElementById('errorContainer').style.display = 'block';
            });
        });
    </script>
</body>
</html>
