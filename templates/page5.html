<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>性能指标分类分析报告</title>
    <link href="{{ url_for('static', filename='css/custom.css') }}" rel="stylesheet">
</head>
<body>
    <div class="app-shell">
        {% set active = 'bda5' %}
        {% include '_sidebar.html' %}

        <div class="main-panel">
            {% include '_topbar.html' %}

            <div class="content">
                {% if error %}
                <div class="alert alert-warning" role="alert">{{ error }}</div>
                {% endif %}

                <div class="card">
                    <div class="card-body">
                        <h4 class="card-title">性能指标分类分析报告（电池失效分类）</h4>
                        <div class="chart-frame">
                            {% if plot_url %}
                            <img src="data:image/png;base64, {{ plot_url }}" alt="分类报告" class="chart-img">
                            {% elif error %}
                            <p class="text-muted text-center">{{ error }}</p>
                            {% else %}
                            <p class="text-muted text-center">暂无数据</p>
                            {% endif %}
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
